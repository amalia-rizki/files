  #konten { display:none; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
             background:#2c3e50; color:white; padding:10px 20px;
             border-radius:20px; font-size:13px; opacity:0;
             transition:opacity 0.3s; pointer-events:none; z-index:9999; }
  #toast.show { opacity:1; }

function salinLink(url, label) {
  var toast = document.getElementById('toast');
  function tampilToast(pesan) {
    toast.textContent = pesan;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2500);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function() {
      tampilToast('✅ Link ' + label + ' disalin!');
    }).catch(function() {
      fallbackCopy(url, label, tampilToast);
    });
  } else {
    fallbackCopy(url, label, tampilToast);
  }
}
function fallbackCopy(url, label, cb) {
  var el = document.createElement('textarea');
  el.value = url;
  el.style.position = 'fixed';
  el.style.opacity = '0';
  document.body.appendChild(el);
  el.focus(); el.select();
  try { document.execCommand('copy'); cb('✅ Link ' + label + ' disalin!'); }
  catch(e) { cb('❌ Gagal menyalin link'); }
  document.body.removeChild(el);
}
