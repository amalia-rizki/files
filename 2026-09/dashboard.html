<div id="toast"></div>
<div id="pesan-error">
  <h2>⛔ Akses Tidak Valid</h2>
  <p>Link tidak lengkap atau password salah.</p>
</div>

<script>
function salinLink(url, label) {
  var toast = document.getElementById('toast');
  function tampilToast(pesan) {
    toast.textContent = pesan;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2500);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function() {
      tampilToast('✅ Link ' + label + ' disalin!');
    }).catch(function() {
      fallbackCopy(url, label, tampilToast);
    });
  } else {
    fallbackCopy(url, label, tampilToast);
  }
}
function fallbackCopy(url, label, cb) {
  var el = document.createElement('textarea');
  el.value = url;
  el.style.position = 'fixed';
  el.style.opacity = '0';
  document.body.appendChild(el);
  el.focus(); el.select();
  try { document.execCommand('copy'); cb('✅ Link ' + label + ' disalin!'); }
  catch(e) { cb('❌ Gagal menyalin link'); }
  document.body.removeChild(el);
}
