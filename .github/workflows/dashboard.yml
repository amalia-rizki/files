name: Perbarui dashboard

# Dijalankan manual dari HP/browser: tab Actions → "Perbarui dashboard" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      bulan:
        description: "Bulan (YYYY-MM). Kosongkan = bulan ini"
        required: false
        default: ""

concurrency:
  group: perbarui-dashboard
  cancel-in-progress: false

jobs:
  perbarui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Jakarta
    steps:
      - name: Ambil repo
        uses: actions/checkout@v4
        with:
          # Token pribadi (bukan token bawaan): push dengan token bawaan TIDAK memicu GitHub Pages.
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang library
        run: pip install -r server/requirements.txt

      - name: Perbarui dashboard
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_EKINERJA_ID: ${{ secrets.GDRIVE_EKINERJA_ID }}
          GDRIVE_GITFILES_ID: ${{ secrets.GDRIVE_GITFILES_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          NAMA_PUSKESMAS: Puskesmas Tambang Ulang
        run: python server/dashboard_actions.py --repo . --bulan "${{ github.event.inputs.bulan }}"

      - name: Simpan & kirim ke GitHub
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add -- '*/dashboard.html'
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan dashboard."
          else
            git commit -m "update dashboard (actions)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
